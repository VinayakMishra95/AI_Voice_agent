apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mermaid-ingress
  namespace: mermaid
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: mermaid.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mermaid-voice-agent
                port:
                  number: 80
